<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Centre commercial MoléonLangon — Trafic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #21262d;
    --text-primary: #e6edf3;
    --text-muted: #7d8590;
    --blue: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #f0883e;
    --bar-neutral: #30363d;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    min-height: 100svh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 32px);
  }

  /* ── HEADER ── */
  .header {
    padding: 22px 20px 0;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }

  .title-block { flex: 1; min-width: 0; }

  .site-name {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  h1 {
    font-size: 20px;
    font-weight: 300;
    line-height: 1.2;
    letter-spacing: -0.02em;
  }
  h1 strong { font-weight: 600; }

  .badge {
    display: inline-block;
    margin-top: 5px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    text-transform: uppercase;
  }

  /* KPI pill — shows SITE COMPLET total */
  .kpi-pill {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: right;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .kpi-value {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text-primary);
  }
  .kpi-sub {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
  }

  /* ── TABS ── */
  .tabs-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -20px;
    padding: 0 20px;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tabs {
    display: flex;
    width: max-content;
    min-width: 100%;
  }

  .tab {
    padding: 12px 20px 13px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    background: none;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    position: relative;
    bottom: -1px;
    font-family: 'DM Sans', sans-serif;
    min-width: 64px;
    text-align: center;
    transition: color 0.15s, border-color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--blue);
  }

  /* ── MAIN ── */
  .main { padding: 24px 20px 0; }

  /* partial notice */
  .partial-notice {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 20px;
    padding: 8px 12px;
    background: rgba(88,166,255,0.05);
    border: 1px solid rgba(88,166,255,0.12);
    border-radius: 8px;
  }
  .partial-notice.show { display: flex; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--blue); flex-shrink:0; }

  /* ── SECTION ── */
  .histo-block { margin-bottom: 32px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .section-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-dot.purple { background: var(--purple); }
  .section-dot.blue   { background: var(--blue); }
  .section-dot.orange { background: var(--orange); }

  .section-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  /* total pill next to section name */
  .section-total-pill {
    margin-left: 4px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 7px;
  }

  .section-var {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .section-var.pos { color: var(--green); }
  .section-var.neg { color: var(--red); }
  .section-var.na  { color: var(--text-muted); }

  /* ── BARS ── */
  .bars-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -20px;
    padding: 0 20px 4px;
  }
  .bars-scroll::-webkit-scrollbar { display: none; }

  .bars-grid {
    display: flex;
    gap: 6px;
    align-items: flex-end;
    height: 110px;
    width: max-content;
    min-width: 100%;
  }

  .bar-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    height: 100%;
    justify-content: flex-end;
    width: 44px;
    flex-shrink: 0;
  }

  .bar-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }

  .bar-pct {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    line-height: 1;
  }
  .bar-pct.pos { color: var(--green); }
  .bar-pct.neg { color: var(--red); }
  .bar-pct.na  { color: var(--bar-neutral); }

  .bar-visual {
    width: 100%;
    min-height: 3px;
    border-radius: 3px 3px 0 0;
  }
  .bar-visual.purple-pos { background: var(--purple); }
  .bar-visual.purple-neg { background: var(--red); opacity: 0.85; }
  .bar-visual.blue-pos   { background: var(--blue); }
  .bar-visual.blue-neg   { background: var(--red); opacity: 0.85; }
  .bar-visual.orange-pos { background: var(--orange); }
  .bar-visual.orange-neg { background: var(--red); opacity: 0.85; }
  .bar-visual.na         { background: var(--bar-neutral); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0 28px;
  }

  .no-data {
    color: var(--text-muted);
    font-size: 13px;
    padding: 16px 0;
    font-style: italic;
    opacity: 0.6;
  }

  /* ── DESKTOP ── */
  @media (min-width: 600px) {
    .header { padding: 28px 36px 0; }
    .main { padding: 28px 36px 0; }
    .tabs-wrap { margin: 0 -36px; padding: 0 36px; }
    .bars-scroll { margin: 0 -36px; padding: 0 36px 4px; }
    h1 { font-size: 24px; }
  }
  @media (min-width: 900px) {
    .header { padding: 36px 48px 0; position: static; }
    .main { padding: 36px 48px 0; }
    .tabs-wrap { margin: 0 -48px; padding: 0 48px; }
    .bars-scroll { overflow-x: visible; margin: 0; padding: 0; }
    .bars-grid { width: auto; min-width: auto; display: grid; grid-template-columns: repeat(12,1fr); gap: 6px; }
    .bar-col { width: auto; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="title-block">
      <div class="site-name">Dashboard Trafic</div>
      <h1>CC <strong>MoléonLangon</strong></h1>
      <div class="badge">Source : MyTraffic</div>
    </div>
    <div class="kpi-pill">
      <div class="kpi-label">Site complet <span id="year-label">—</span></div>
      <div class="kpi-value" id="kpi-total">—</div>
      <div class="kpi-sub" id="kpi-sub">—</div>
    </div>
  </div>
  <div class="tabs-wrap">
    <div class="tabs" id="tabs"></div>
  </div>
</div>

<div class="main">
  <div class="partial-notice" id="partial-notice">
    <div class="dot"></div>
    <span id="partial-text"></span>
  </div>

  <!-- 1. SITE COMPLET -->
  <div class="histo-block">
    <div class="section-header">
      <div class="section-dot purple"></div>
      <div class="section-name">Site complet</div>
      <div class="section-total-pill" id="total-site">—</div>
      <div class="section-var na" id="var-site">—</div>
    </div>
    <div class="bars-scroll"><div class="bars-grid" id="bars-site"></div></div>
  </div>

  <div class="divider"></div>

  <!-- 2. GALERIE + PROMENADE -->
  <div class="histo-block">
    <div class="section-header">
      <div class="section-dot blue"></div>
      <div class="section-name">Galerie &amp; Promenade</div>
      <div class="section-total-pill" id="total-gal">—</div>
      <div class="section-var na" id="var-gal">—</div>
    </div>
    <div id="gal-content">
      <div class="bars-scroll"><div class="bars-grid" id="bars-gal"></div></div>
    </div>
  </div>


</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
// File 1 = Retail Park = SITE COMPLET
const siteMonthly = {
  2020: [284900,302900,211500,159200,262300,295100,308800,292100,286700,266500,151400,276800],
  2021: [162500,145800,219700,190600,209600,256200,236600,223300,287400,294100,307200,367000],
  2022: [334000,315400,349100,348900,351100,343600,383400,376000,375600,391900,377200,531100],
  2023: [384600,373200,405200,427700,428900,429100,451300,443700,389800,434700,427000,575000],
  2024: [409600,368600,389200,378600,396000,407400,431400,446300,433500,417200,444700,547700],
  2025: [425200,373300,386400,385800,416400,412600,433800,444100,407600,420600,420400,517600],
  2026: [435000,367300,385500,401500,397400,437900,463900,null,null,null,null,null]
};

// File 2 = Galerie + Promenade only
const galMonthly = {
  2023: [null,null,null,null,null,null,null,null,304400,339700,287300,428700],
  2024: [274900,240600,252700,234800,255900,265600,290200,306600,300400,294900,313500,414100],
  2025: [296400,254200,259800,249400,277500,273200,298000,298600,277700,301100,293700,389200],
  2026: [308100,278100,264800,274900,275400,296200,318800,null,null,null,null,null]
};



const months = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const years  = [2020,2021,2022,2023,2024,2025,2026];
let currentYear = 2026;

// ── HELPERS ───────────────────────────────────────────────────────────────────
function sum(arr) { return (arr||[]).filter(v=>v!=null).reduce((a,b)=>a+b,0); }
function pct(c,p) { if(c==null||p==null||p===0) return null; return ((c-p)/p)*100; }
function fmt(n)   { return n ? n.toLocaleString('fr-FR') : '—'; }

function yearRange(data) {
  const idx = (data||[]).map((v,i)=>v!=null?i:-1).filter(i=>i>=0);
  if(!idx.length) return null;
  return { first: months[idx[0]], last: months[idx[idx.length-1]], count: idx.length };
}

function globalVar(curr, prev) {
  if(!prev) return null;
  let sc=0, sp=0;
  (curr||[]).forEach((v,i)=>{ if(v!=null && prev[i]!=null){ sc+=v; sp+=prev[i]; } });
  return sp>0 ? ((sc-sp)/sp)*100 : null;
}

// ── SECTION PILL ──────────────────────────────────────────────────────────────
function updatePill(totalId, varId, curr, prev) {
  const total = sum(curr);
  document.getElementById(totalId).textContent = total ? fmt(total) : '—';

  const v = globalVar(curr, prev);
  const el = document.getElementById(varId);
  if(v == null) {
    el.textContent = '—'; el.className = 'section-var na';
  } else {
    const sign = v>=0?'+':'';
    el.textContent = sign+v.toFixed(1)+'% vs '+(currentYear-1);
    el.className = 'section-var '+(v>=0?'pos':'neg');
  }
}

// ── BUILD HISTOGRAM ───────────────────────────────────────────────────────────
function buildHisto(gridId, curr, prev, color) {
  const grid = document.getElementById(gridId);
  if(!grid) return;
  grid.innerHTML = '';

  const pcts = (curr||Array(12).fill(null)).map((v,i)=>{
    if(v==null) return null;
    return (prev && prev[i]!=null) ? pct(v, prev[i]) : null;
  });

  const valid = pcts.filter(p=>p!=null);
  const maxAbs = Math.max(...valid.map(Math.abs), 0.1);
  const BAR_MAX = 62;

  months.forEach((m,i) => {
    const col = document.createElement('div');
    col.className = 'bar-col';

    const p = pcts[i];
    const pctEl = document.createElement('div');
    const barEl = document.createElement('div');
    barEl.className = 'bar-visual';

    if(p == null) {
      pctEl.className = 'bar-pct na'; pctEl.textContent = '—';
      barEl.classList.add('na'); barEl.style.height = '3px';
    } else {
      const sign = p>=0?'+':''; const cls = p>=0?'pos':'neg';
      pctEl.className = 'bar-pct '+cls;
      pctEl.textContent = sign+p.toFixed(1)+'%';
      barEl.classList.add(`${color}-${cls}`);
      barEl.style.height = Math.max(3,Math.round((Math.abs(p)/maxAbs)*BAR_MAX))+'px';
    }

    const lbl = document.createElement('div');
    lbl.className = 'bar-label'; lbl.textContent = m;

    col.appendChild(pctEl); col.appendChild(barEl); col.appendChild(lbl);
    grid.appendChild(col);
  });
}

// ── BUILD SECTION with optional "no data" fallback ────────────────────────────
function buildSection(contentId, gridId, curr, prev, color) {
  const container = document.getElementById(contentId);
  const hasData = curr && curr.some(v=>v!=null);
  if(!hasData) {
    container.innerHTML = '<div class="no-data">Données non disponibles pour cette année.</div>';
    return;
  }
  container.innerHTML = `<div class="bars-scroll"><div class="bars-grid" id="${gridId}"></div></div>`;
  buildHisto(gridId, curr, prev, color);
}

// ── KPI ───────────────────────────────────────────────────────────────────────
function updateKPI(y) {
  // Use site complet for total; fall back to gal if no site data
  const curr = siteMonthly[y] || galMonthly[y] || Array(12).fill(null);
  const range = yearRange(curr);
  const isPartial = range && range.count < 12;
  const total = sum(curr);

  document.getElementById('year-label').textContent = y;
  document.getElementById('kpi-total').textContent  = fmt(total);
  document.getElementById('kpi-sub').textContent    =
    range ? (isPartial ? `${range.first}–${range.last} · partiel` : 'Jan–Déc') : '—';

  const notice = document.getElementById('partial-notice');
  if(isPartial && range) {
    notice.classList.add('show');
    document.getElementById('partial-text').textContent =
      `Données de ${range.first} à ${range.last} ${y} (${range.count}/12 mois)`;
  } else {
    notice.classList.remove('show');
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
function buildTabs() {
  const c = document.getElementById('tabs');
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'tab'+(y===currentYear?' active':'');
    btn.textContent = y;
    btn.addEventListener('click', ()=>selectYear(y));
    c.appendChild(btn);
  });
}
function selectYear(y) {
  currentYear = y;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',parseInt(t.textContent)===y));
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const y    = currentYear;
  const prev = y - 1;

  const sCurr = siteMonthly[y]   || null;
  const sPrev = siteMonthly[prev] || null;
  const gCurr = galMonthly[y]    || null;
  const gPrev = galMonthly[prev]  || null;
  updateKPI(y);

  // Site complet
  updatePill('total-site','var-site', sCurr, sPrev);
  buildSection('bars-site','bars-site-grid', sCurr, sPrev, 'purple');

  // Galerie + Promenade
  updatePill('total-gal','var-gal', gCurr, gPrev);
  buildSection('gal-content','bars-gal-grid', gCurr, gPrev, 'blue');
}

buildTabs();
render();
</script>
</body>
</html>
